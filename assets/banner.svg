<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Lucas Abreu, Data Engineer</title>
  <desc id="d">Banner com o nome, o cargo e um grafo animado representando um pipeline de dados.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#BDBDBD"/><stop offset="1" stop-color="#6B6B6B"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#BDBDBD"/><stop offset="1" stop-color="#6B6B6B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#BDBDBD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#6B6B6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C1C1C"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .edge { fill: none; stroke: #262626; stroke-width: 2; }
    .flow { fill: none; stroke: url(#accentH); stroke-width: 2.5; stroke-linecap: round;
             stroke-dasharray: 10 22; animation: flow 3.6s linear infinite; }
    .node { fill: #141414; stroke: #FFFFFF; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
    .hub { fill: #141414; stroke: #BDBDBD; stroke-width: 2; }
    .halo { fill: none; stroke: #6B6B6B; stroke-width: 1.5; opacity: .5; transform-origin: 1100px 200px;
             animation: halo 3s ease-out infinite; }
    .cap { font: 500 13px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; fill: #4A4A4A; letter-spacing: 2px; }
    .prompt { font: 500 21px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; fill: #8A8A8A; }
    .name { font: 700 72px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #FAFAFA; letter-spacing: -1px; }
    .role { font: 600 36px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: url(#accentH); }
    .word { font: 500 21px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; fill: #FAFAFA; opacity: 0; animation: cycle 12s linear infinite; }
    .cursor { fill: #FFFFFF; animation: blink 1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -64; } }
    @keyframes pulse { 50% { stroke: #6B6B6B; } }
    @keyframes halo { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.5); opacity: 0; } }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .node, .halo, .cursor { animation: none; }
      .word { animation: none; } .word:first-of-type { opacity: 1; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0A0A0A"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <circle cx="980" cy="120" r="320" fill="url(#glowA)"/>
    <circle cx="160" cy="420" r="300" fill="url(#glowB)"/>
    <rect x="0" y="397" width="1200" height="3" fill="url(#accentH)"/>

    <g>
      <text x="72" y="110" class="prompt">~/lucxszs $ whoami</text>
    </g>
    <g>
      <text x="68" y="194" class="name">Lucas Abreu</text>
    </g>
    <g>
      <text x="72" y="246" class="role">Data Engineer</text>
    </g>
    <g>
      <text x="72" y="306" class="prompt">construindo</text>
      <g>
    <text x="72" y="306" class="word" style="animation-delay:0s"><tspan fill-opacity="0">construindo </tspan>pipelines</text>
    <text x="72" y="306" class="word" style="animation-delay:3s"><tspan fill-opacity="0">construindo </tspan>data lakes</text>
    <text x="72" y="306" class="word" style="animation-delay:6s"><tspan fill-opacity="0">construindo </tspan>data warehouses</text>
    <text x="72" y="306" class="word" style="animation-delay:9s"><tspan fill-opacity="0">construindo </tspan>plataformas de dados</text>
      </g>
    </g>

    <g>
      <path d="M800,95 C875.0,95 875.0,145 950,145" class="edge"/>
      <path d="M800,95 C875.0,95 875.0,145 950,145" class="flow" style="animation-delay:-0.00s"/>
      <path d="M800,165 C875.0,165 875.0,145 950,145" class="edge"/>
      <path d="M800,165 C875.0,165 875.0,145 950,145" class="flow" style="animation-delay:-0.45s"/>
      <path d="M800,235 C875.0,235 875.0,255 950,255" class="edge"/>
      <path d="M800,235 C875.0,235 875.0,255 950,255" class="flow" style="animation-delay:-0.90s"/>
      <path d="M800,305 C875.0,305 875.0,255 950,255" class="edge"/>
      <path d="M800,305 C875.0,305 875.0,255 950,255" class="flow" style="animation-delay:-1.35s"/>
      <path d="M800,165 C875.0,165 875.0,255 950,255" class="edge"/>
      <path d="M800,165 C875.0,165 875.0,255 950,255" class="flow" style="animation-delay:-1.80s"/>
      <path d="M950,145 C1025.0,145 1025.0,200 1100,200" class="edge"/>
      <path d="M950,145 C1025.0,145 1025.0,200 1100,200" class="flow" style="animation-delay:-2.25s"/>
      <path d="M950,255 C1025.0,255 1025.0,200 1100,200" class="edge"/>
      <path d="M950,255 C1025.0,255 1025.0,200 1100,200" class="flow" style="animation-delay:-2.70s"/>
      <circle cx="800" cy="95" r="7" class="node" style="animation-delay:-0.0s"/>
      <circle cx="800" cy="165" r="7" class="node" style="animation-delay:-0.6s"/>
      <circle cx="800" cy="235" r="7" class="node" style="animation-delay:-1.2s"/>
      <circle cx="800" cy="305" r="7" class="node" style="animation-delay:-1.8s"/>
      <rect x="936" y="131" width="28" height="28" rx="7" class="hub"/>
      <rect x="936" y="241" width="28" height="28" rx="7" class="hub"/>
      <circle cx="1100" cy="200" r="30" class="halo"/>
      <circle cx="1100" cy="200" r="16" fill="url(#accent)"/>
    </g>
    <text x="800" y="356" class="cap" text-anchor="middle">INGEST</text>
    <text x="950" y="356" class="cap" text-anchor="middle">MODEL</text>
    <text x="1100" y="356" class="cap" text-anchor="middle">DECIDE</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#262626"/>
</svg>
